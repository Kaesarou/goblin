[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goblin-trading-bot"
version = "0.1.0"
description = "Deterministic intraday trading bot with market-aware execution guards"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
    "websockets>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
calibration = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scikit-learn==1.8.0",
]

[tool.setuptools.package-data]
"app.execution.scoring" = ["models/*.json"]
"app.v3.artifacts" = ["*.json"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
