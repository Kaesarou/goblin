services:
  goblin:
    image: ${GOBLIN_IMAGE:?GOBLIN_IMAGE must reference an immutable GHCR image}
    container_name: goblin-bot
    init: true
    env_file:
      - .env
    # Explicit DEMO-only close watcher: no V3 BUY until the existing manual
    # closes are no longer present in the portfolio and pending OPEN is empty
    # on two independent account checks. Never import or close external legs.
    environment:
      GOBLIN_OBSERVATION_ONLY: "0"
      GOBLIN_DEMO_AUTO_REARM_AFTER_MANUAL_CLOSE: "1"
    volumes:
      - ./data:/app/data
    # Persisted five-start breaker still wraps each actual app start.
    command: ["python", "-m", "scripts.demo_rearm_after_manual_closes"]
    restart: "on-failure:5"
    stop_signal: SIGTERM
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
