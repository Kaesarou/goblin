services:
  goblin:
    image: ${GOBLIN_IMAGE:?GOBLIN_IMAGE must reference an immutable GHCR image}
    container_name: goblin-bot
    init: true
    env_file:
      - .env
    # The persistent guard starts the DEMO close watcher. No new BUY until
    # two independent broker-flat checks and V3's own reconciliation.
    environment:
      GOBLIN_OBSERVATION_ONLY: "0"
      GOBLIN_DEMO_AUTO_REARM_AFTER_MANUAL_CLOSE: "1"
    volumes:
      - ./data:/app/data
    # The guard is always the parent and forwards SIGTERM to its child.
    command: ["python", "-m", "app.runtime.restart_guard"]
    restart: "on-failure:5"
    stop_signal: SIGTERM
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
