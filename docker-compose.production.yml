services:
  goblin:
    image: ${GOBLIN_IMAGE:?GOBLIN_IMAGE must reference an immutable GHCR image}
    container_name: goblin-bot
    init: true
    env_file:
      - .env
    # Recovery release: collect real DEMO payloads without rearming BUYs even if
    # manually queued closes complete before the next preflight. A separate
    # reviewed release is required to enable broker mutations again.
    environment:
      GOBLIN_OBSERVATION_ONLY: "1"
    volumes:
      - ./data:/app/data
    # Count starts in a persistent 30-minute window: Docker may reset its own
    # retry counter after 10 seconds of uptime. A tripped guard exits 0 without
    # submitting broker actions, and requires operator review before restart.
    command: ["python", "-m", "app.runtime.restart_guard"]
    restart: "on-failure:5"
    stop_signal: SIGTERM
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
